[package]
name = "cosmo-plus"
version = "0.2.0"
edition = "2021"

[lib]
name = "cosmo_plus"
crate-type = ["cdylib"]

[dependencies]
# StarCraft 1.16.1 struct/data layer (v116 layout: do NOT enable `scr-only`).
bw_dat = { git = "https://github.com/neivv/aise.git", rev = "da4fed681dc09bda7a21c0051f60cdad98cc7226" }
# 1.16.1 plugin surface: resolves globals/functions and wraps `whack`.
samase_shim = { git = "https://github.com/neivv/samase_plugin", rev = "c01a88f00b1aaf6286f96940b0f04498cea6c7b7" }
once_cell = "1.7"

# Pure, host-testable logic (saturation model + YAML/plus.yml parsing).
cosmo-plus-core = { path = "../cosmo-plus-core" }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
